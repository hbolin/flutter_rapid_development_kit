name: flutter_rapid_development_kit
description: "created based on flutter 3.27.1-stable version"
version: 0.0.1
homepage:

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # https://pub-web.flutter-io.cn/packages/intl
  intl: any

  # https://pub-web.flutter-io.cn/packages/get
  get: 4.6.6

  # https://pub-web.flutter-io.cn/packages/universal_platform
  universal_platform: 1.1.0

  # https://pub-web.flutter-io.cn/packages/fluttertoast
  fluttertoast: 8.2.10

  # https://pub-web.flutter-io.cn/packages/yaml
  yaml: 3.1.3

  # https://pub-web.flutter-io.cn/packages/cached_network_image
  cached_network_image: 3.4.1

  # https://pub.flutter-io.cn/packages/carousel_slider
  carousel_slider: 5.0.0

  # https://pub-web.flutter-io.cn/packages/logger
  logger: 2.5.0

  # https://pub-web.flutter-io.cn/packages/shared_preferences
  shared_preferences: 2.3.5

  # https://pub-web.flutter-io.cn/packages/synchronized
  synchronized: 3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  test: ^1.25.8

